# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs the tests with the development mixtime-based tsibble.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-mixtime.yaml

permissions: read-all

jobs:
  test-mixtime:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::pkgload
            mitchelloharawild/mixtime
            tidyverts/tsibble@mixtime
          needs: check

      - name: Check that tsibble intervals are mixtime time units
        run: |
          x <- tsibble::tsibble(t = 1:2, index = t)
          stopifnot(inherits(tsibble::interval(x), "mixtime::mt_unit"))
        shell: Rscript {0}

      - name: Test
        run: testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}
